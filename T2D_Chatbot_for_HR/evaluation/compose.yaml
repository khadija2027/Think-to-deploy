# Run together with the repository's docker-compose.yaml (its paths are the base).
services:
  rag-evaluation:
    build:
      context: .
      dockerfile: T2D_Chatbot_for_HR/evaluation/Dockerfile
    env_file:
      - ./T2D_Chatbot_for_HR/evaluation/.env.groq
    environment:
      PYTHONPATH: /opt/project
      HF_HOME: /opt/rag/model-cache
      RAG_INDEX_DIR: /opt/rag/index
      RAG_API_URL: http://fastapi:8000
      RAGAS_DO_NOT_TRACK: "true"
    volumes:
      - ./T2D_Chatbot_for_HR/evaluation:/evaluation
      - rag-index:/opt/rag/index:ro
      - api-model-cache:/opt/rag/model-cache
    healthcheck:
      disable: true
    restart: "no"
